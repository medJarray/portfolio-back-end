name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  NODE_VERSION: '18.x'
  YARN_VERSION: '4.5.0'

jobs:
  # =======================
  # Stage 1: Build
  # =======================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build.outputs.version }}
      short_sha: ${{ steps.build.outputs.short_sha }}

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Enable Corepack
      - name: Enable Corepack
        run: corepack enable

      # Set up Yarn
      - name: Set up Yarn version to ${{ env.YARN_VERSION }}
        run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate

      # Verify correct yarn version
      - name: Check Yarn version
        run: yarn --version

      # Install dependencies
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 300000  # 5 minutes timeout

      - name: Build application
        run: yarn build

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.repository.version }}
          path: |
            dist
            package.json
            yarn.lock
            .yarnrc.yml
          retention-days: 7

  # =======================
  # Stage 2: Test
  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: [build]

    strategy:
      matrix:
        node-version: [18.x]
        test-type: [unit, e2e, lint]
      fail-fast: true

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Set up Yarn version to ${{ env.YARN_VERSION }}
      - name: Set up Yarn version to ${{ env.YARN_VERSION }}
        run: corepack prepare yarn@${{ env.YARN_VERSION }} --activate

      # Install dependencies
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 300000  # 5 minutes timeout

      # Run linting
      - name: Run linting
        if: matrix.test-type == 'lint'
        run: yarn lint

      # Run tests
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: yarn test --passWithNoTests

      # Upload test coverage
      - name: Upload test coverage
        if: matrix.test-type == 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.version }}
          path: coverage
          retention-days: 7

  # ===============================
  # Stage 3: Publish To DockerHub
  # ===============================
  publish:
    name: Publish To DockerHub
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'

    outputs:
      image-tag: ${{ steps.build.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      main-tag: ${{ secrets.IMAGE_NAME }}:${{ needs.build.outputs.version }}

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to DockerHub
      - name: Login in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract Metadata
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha, event=branch
            type=raw, value=${{ needs.build.outputs.version }}
            type=raw, value=latest,enable={{ is_default_branch }}
            type=raw, value=${{ github.ref_name }}-latest

      # Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            BUILD_VERSION=${{ needs.build.outputs.version }}
            BUILD_REVISION=${{ needs.build.outputs.short-sha }}

      - name: 📋 Image published
        run: |
          echo "🎉 Image successfully published to Docker Hub!"
          echo "📦 Tags: ${{ steps.meta.outputs.tags }}"
          echo "🔍 Digest: ${{ steps.build.outputs.digest }}"
          echo "🌐 Main tag: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}"

# ==========================================
  # SUMMARY
  # ==========================================
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [build, test, publish]
    if: always()

    steps:
      - name: 📊 CI Results Summary
        run: |
          echo "## 📊 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test | ${{ needs.test.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Publish | ${{ needs.publish.result == 'success' && '✅ Success' || needs.publish.result == 'skipped' && '⏭️ Skipped (PR)' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.publish.result }}" = "success" ]; then
            echo "🎉 **Image published successfully to Docker Hub!**" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "🐳 **Image:** \`${{ needs.publish.outputs.main-tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Ready for deployment!" >> $GITHUB_STEP_SUMMARY
          fi
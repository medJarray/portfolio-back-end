name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environement:
        description: "Environment to deploy to"
        required: true
        default: "dev"
        options:
          - dev
          - prod
      image_tag:
        description: "Docker image tag"
        required: false
        default: "latest"

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}

jobs:
  # =============================
  # DETERMINE DEPLOYMENT STRATEGY
  # =============================
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.name == 'workflow_dispatch'

    outputs:
      deploy-dev: ${{ steps.strategy.outputs.deploy-dev }}
      deploy-prod: ${{ steps.strategy.outputs.deploy-prod }}
      image-tag: ${{ steps.strategy.outputs.image-tag }}
      environment: ${{ steps.strategy.outputs.environment }}

    steps:
      - name: Determine deployment strategy
        id: strategy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual deployment
            if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
              echo "deploy-dev=true" >> $GITHUB_OUTPUT
              echo "deploy-prod=false" >> $GITHUB_OUTPUT
              echo "environment=development" >> $GITHUB_OUTPUT
            else
              echo "deploy-dev=false" >> $GITHUB_OUTPUT
              echo "deploy-prod=true" >> $GITHUB_OUTPUT
              echo "environment=production" >> $GITHUB_OUTPUT
            fi

            if [ -n "${{ github.event.inputs.image_tag }}" ]; then
              echo "image-tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            else
              SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
              echo "image-tag=${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            fi
          else
            # Automatic deployment after CI
            SHORT_SHA=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)
            if [ "${{ github.event.workflow_run.head_branch }}" = "develop" ]; then
              echo "deploy-dev=true" >> $GITHUB_OUTPUT
              echo "deploy-prod=false" >> $GITHUB_OUTPUT
              echo "environment=development" >> $GITHUB_OUTPUT
              echo "image-tag=${{ env.IMAGE_NAME }}:develop-${SHORT_SHA}" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              echo "deploy-dev=false" >> $GITHUB_OUTPUT
              echo "deploy-prod=true" >> $GITHUB_OUTPUT
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "image-tag=${{ env.IMAGE_NAME }}:main-${SHORT_SHA}" >> $GITHUB_OUTPUT
            else
              echo "deploy-dev=false" >> $GITHUB_OUTPUT
              echo "deploy-prod=false" >> $GITHUB_OUTPUT
              echo "environment=none" >> $GITHUB_OUTPUT
              echo "image-tag=none" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Verify Docker image exists
        if: steps.strategy.outputs.image-tag != 'none'
        run: |
          echo "Checking if Docker image exists: ${{ steps.strategy.outputs.image-tag }}"

          # Check if the image exists in Docker Hub
          if docker  manifest inspect ${{ steps.strategy.outputs.image-tag }} > /dev/null 2>&1; then
            echo "Docker image ${{ steps.strategy.outputs.image-tag }} exists."
          else
            echo "Docker image ${{ steps.strategy.outputs.image-tag }} does not exist."
            exit 1
          fi
      - name: Deployment Plan
        run: |
          echo "## 🚀 Deployment Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Development | ${{ steps.strategy.outputs.deploy-dev == 'true' && '✅ Yes' || '⏭️ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Production | ${{ steps.strategy.outputs.deploy-prod == 'true' && '✅ Yes' || '⏭️ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Docker Image:** \`${{ steps.strategy.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.strategy.outputs.image-tag }}" != "none" ]; then
            echo "🔗 **Docker Hub:** [View Image](https://hub.docker.com/r/${{ env.IMAGE_NAME }}/tags)" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # DEPLOY TO DEVELOPMENT
  # ==========================================
  deploy-dev:
    name: 🟡 Deploy to Development
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.deploy-dev == 'true'
    environment:
      name: development
      url: ${{ vars.DEV_APP_URL }}

    steps:
      - name: 🟡 Deploy to Development Environment
        run: |
          echo "🚀 Deploying to Development..."
          echo "📦 Docker Image: ${{ needs.setup.outputs.image-tag }}"

          # Trigger Render deployment avec l'image Docker Hub
          curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "clearCache": false,
              "serviceId": "${{ secrets.RENDER_DEV_SERVICE_ID }}"
            }' \
            --fail-with-body \
            --retry 3 \
            --retry-delay 5

      - name: ⏳ Wait for deployment
        run: |
          echo "⏳ Waiting for deployment to complete..."
          echo "🐳 Image being deployed: ${{ needs.setup.outputs.image-tag }}"
          sleep 45

      - name: 🔍 Health Check - Development
        run: |
          echo "🔍 Checking application health..."

          max_attempts=12
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
            
            response=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.DEV_APP_URL }}/health" || echo "000")
            
            if [ "$response" = "200" ]; then
              echo "✅ Development deployment successful!"
              echo "🌍 Application available at: ${{ vars.DEV_APP_URL }}"
              
              # Afficher les détails du health check
              curl -s "${{ vars.DEV_APP_URL }}/health" | jq '.' || echo "Health check response received"
              exit 0
            fi
            
            echo "❌ Health check failed (HTTP $response), retrying in 15 seconds..."
            sleep 15
            attempt=$((attempt + 1))
          done

          echo "❌ Deployment failed - health check timeout"
          echo "🔗 Check Render logs: https://dashboard.render.com/web/${{ secrets.RENDER_DEV_SERVICE_ID }}"
          exit 1

      - name: 📢 Notify Development Deployment
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Development Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌍 **URL:** [${{ vars.DEV_APP_URL }}](${{ vars.DEV_APP_URL }})" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Docker Image:** \`${{ needs.setup.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
            echo "⏰ **Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Health Check:** [${{ vars.DEV_APP_URL }}/health](${{ vars.DEV_APP_URL }}/health)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Development Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Check Render Logs:** [Service Logs](https://dashboard.render.com/web/${{ secrets.RENDER_DEV_SERVICE_ID }})" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Failed Image:** \`${{ needs.setup.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # DEPLOYMENT SUMMARY
  # ==========================================
  cd-summary:
    name: 📊 CD Summary
    runs-on: ubuntu-latest
    needs: [setup, deploy-dev]
    if: always()

    steps:
      - name: 📊 Generate Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | URL | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|-----|-------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.setup.outputs.deploy-dev }}" = "true" ]; then
            if [ "${{ needs.deploy-dev.result }}" = "success" ]; then
              echo "| 🟡 Development | ✅ Success | [${{ vars.DEV_APP_URL }}](${{ vars.DEV_APP_URL }}) | \`${{ needs.setup.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 🟡 Development | ❌ Failed | - | \`${{ needs.setup.outputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| 🟡 Development | ⏭️ Skipped | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🐳 **Docker Hub:** [View Repository](https://hub.docker.com/r/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Completed:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          # Performance summary
          if [ "${{ needs.post-deployment-tests.result }}" = "success" ]; then
            echo "🧪 **Post-deployment tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.post-deployment-tests.result }}" = "failure" ]; then
            echo "🧪 **Post-deployment tests:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "🧪 **Post-deployment tests:** ⏭️ Skipped" >> $GITHUB_STEP_SUMMARY
          fi
